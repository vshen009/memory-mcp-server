[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-mcp-server"
version = "1.0.1"
description = "Memory MCP Server with Mem0 backend"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Vincent" }
]
keywords = ["mcp", "mem0", "memory", "agent", "openclaw"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "mcp>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/fatcatMaoFei/memory-mcp-server"
Repository = "https://github.com/fatcatMaoFei/memory-mcp-server"
Issues = "https://github.com/fatcatMaoFei/memory-mcp-server/issues"

[project.scripts]
memory-mcp-server = "memory_mcp_server.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["memory_mcp_server*"]
